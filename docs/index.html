<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origami Diagram Maker</title>
<meta name="description" content="A desktop program for making step-by-step origami diagrams from crease patterns.">
<style>
  :root { --bg: #fbfaf7; --fg: #1f2328; --muted: #5b616b; --accent: #b4442f; --line: #e3e0d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --fg: #e8e6e1; --muted: #a3a8b0; --accent: #e07a62; --line: #2c3036; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 16px; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 12px; }
  .lead { font-size: 1.15rem; color: var(--muted); margin: 0 0 40px; }
  .status { border-left: 3px solid var(--accent); padding: 4px 0 4px 16px; margin: 0 0 40px; }
  a { color: var(--accent); }
  footer { border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Origami Diagram Maker</h1>
  <p class="lead">A desktop program for making step-by-step origami diagrams from crease patterns.</p>
  <p class="status">The first public release is coming soon. Downloads will appear here.</p>
  <footer>
    Contact: <a href="mailto:origamidiagrammaker@gmail.com">origamidiagrammaker@gmail.com</a>
  </footer>
</main>
</body>
</html>
